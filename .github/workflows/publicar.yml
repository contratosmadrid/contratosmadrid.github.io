name: Publicar mapa

on:
  push:
    branches: [main]
    paths: ['datos/**', 'web/**', 'herramientas/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r herramientas/requirements.txt

      - name: 1 · Validar el Excel y generar los datos
        run: python herramientas/excel_a_datos.py

      - name: 2 · Límites de los 21 distritos (copia local)
        run: |
          set -e
          f=web/data/madrid-districts.geojson
          if [ ! -s "$f" ]; then
            curl -fsSL --retry 3 -o "$f" https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/madrid-districts.geojson \
            || curl -fsSL --retry 3 -o "$f" https://cdn.jsdelivr.net/gh/codeforgermany/click_that_hood@main/public/data/madrid-districts.geojson
          fi
          python -c "import json,sys;n=len(json.load(open('$f'))['features']);print('Distritos en la geometría:',n);sys.exit(0 if n>=21 else 1)"

      - name: 3 · Logo oficial (copia local)
        continue-on-error: true
        run: |
          mkdir -p web/img
          f=web/img/logo-ayuntamiento.png
          if [ ! -s "$f" ]; then
            curl -fsSL --retry 2 -o "$f" https://www.madrid.es/imagenes/marca/escudo-negro-467.png \
            || curl -fsSL --retry 2 -o "$f" https://transparencia.madrid.es/imagenes/marca/escudo-negro-467.png \
            || rm -f "$f"
          fi
          ls -la web/img || true

      - name: 4 · Guardar en el repositorio los datos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add web/data web/img
          git diff --cached --quiet || git commit -m "Datos regenerados desde el Excel"
          git push || echo "No se pudo guardar la copia (no impide publicar)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
